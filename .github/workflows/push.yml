name: Flutter CI/CD

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*-release"]

permissions:
  contents: write

jobs:
  ci:
    uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/workflows/push.yml@v1
    with:
      flutter_version: ${{ vars.FLUTTER_VERSION || '3.35.5' }}
      flutter_channel: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
      version_name: "1.0.0"
      build_number: ${{ github.run_number }}
      coverage_threshold: ${{ vars.COVERAGE_THRESHOLD || '30' }}
      # Build only for release tags, the only case `cd` needs artifacts.
      run_build: ${{ startsWith(github.ref, 'refs/tags/') }}
      build_ios: ${{ startsWith(github.ref, 'refs/tags/') && vars.BUILD_IOS == 'true' }}
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}

  cd:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci]
    uses: Rite-Technologies-23/ops-rite-flutter-cicd/.github/workflows/release.yml@v1
    with:
      version: "1.0.0"
      build_number: ${{ github.run_number }}
      package_name: com.rite.getx
      ios_bundle_id: com.rite.getx
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
